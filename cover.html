<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cover Letter</title>
  <link rel="stylesheet" href="cover.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
  
  <div id="nav">
    <span class="line">☰</span>
  </div>
  
  <div id="header">
        <div id="imgmen">
      <img src="men.jpg" class="men" alt="menimg" />
    </div>
    <div id="text">
      <h2 class="h2">AI Cover Letter</h2>
      <h2 class="builder">Builder</h2>
      <p class="para">Fill in your details and let AI create a professional cover letter for you</p>
    </div>

  </div>
  
  <div id="usercard">
    
    <p class="p1">Your Name</p>
    <input type="text" id="userName" class="name" placeholder="Enter your full name">
    
    <p class="p1">Job Role</p>
    <input type="text" id="jobRole" class="name" placeholder="Enter job role you are applying for">
    
    <p class="p1">Company Name</p>
    <input type="text" id="companyName" class="name" placeholder="Enter company name">
    
    <p class="p1">Your Skills</p>
    <textarea id="userSkills" class="name skills-box" placeholder="Enter your skills (comma separated)"></textarea>
    <div class="char-count"><span id="charCount">0</span>/300</div>
    
    <button class="btn" onclick="generateLetter()"> Generate Cover Letter</button>
    
  </div>
  
  <div id="output-card">
    <div class="output-header">
      <p class="p1">Generated Cover Letter</p>
      <span class="copy-btn" onclick="copyLetter()">Copy</span>
    </div>
    <div class="output-box">
      <p class="output-text" id="outputText">Your AI generated cover letter will appear here...</p>
    </div>
  </div>
  
  
  
  <script src="cover.js"></script>
</body>

</html>
